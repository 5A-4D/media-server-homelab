name: Validate homelab reference

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Test containment failures and private-report boundaries
        run: python -m unittest discover -s tests -q
      - name: Reproduce fictional report
        run: |
          python scripts/audit_host.py --output build/audit-report.json
          cmp demo/audit-report.json build/audit-report.json
      - name: Validate reference configuration without starting services
        run: |
          docker compose --env-file examples/.env.example -f examples/compose.jellyfin.yaml config --quiet
          docker compose --env-file examples/.env.example -f examples/compose.jellyfin.yaml -f examples/compose.jellyfin-gpu.yaml config --quiet
          docker compose --env-file examples/.env.example -f examples/compose.downloads.yaml config --quiet
