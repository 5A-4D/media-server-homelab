name: homelab-downloads
services:
  vpn:
    image: qmcgaw/gluetun@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: media-vpn
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      FIREWALL_INPUT_PORTS: "8080"
      DNS_UPSTREAM_RESOLVER_TYPE: dot
      DNS_UPSTREAM_RESOLVERS: cloudflare
      TZ: UTC
    volumes:
      - type: bind
        source: ${WIREGUARD_CONFIG:-../secrets/wireguard.conf}
        target: /gluetun/wireguard/wg0.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${STATE_ROOT:-../state}/gluetun
        target: /gluetun
        bind: {create_host_path: false}
    # Publish on the gateway, never independently on the downloader.
    ports:
      - "${DOWNLOAD_UI_BIND_ADDRESS:-127.0.0.1}:8080:8080/tcp"
    networks: [vpn_bridge]
    restart: unless-stopped

  qbittorrent:
    build:
      context: ./qbittorrent
      args:
        DOWNLOAD_UID: ${DOWNLOAD_UID:-10002}
        DOWNLOAD_GID: ${DOWNLOAD_GID:-10002}
    image: homelab-downloader:local
    container_name: media-downloads
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
    group_add:
      - "${MEDIA_GID:-10000}"
    volumes:
      - type: bind
        source: ${STATE_ROOT:-../state}/qbittorrent
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${DATA_ROOT:-/srv/example-media-data}/downloads
        target: /downloads
        bind: {create_host_path: false}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  vpn_bridge:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-media-vpn
